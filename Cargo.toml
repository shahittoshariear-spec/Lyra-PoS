[package]
name = "lyra-pos"
version = "1.8.51"
edition = "2024"
description = "Offline point-of-sale app for small shops. A Rust + Tauri rebuild of End PoS (formerly Immaculate POS) by Shariear's Software."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = { version = "0.36.1", features = ["dates"] }
chrono = "0.4.45"
csv = "1.4.0"
dirs = "7.0.0"
lettre = { version = "0.11.23", default-features = false, features = [
    "builder",
    "hostname",
    "rustls-tls",
    "smtp-transport",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
unicode-normalization = "0.1.25"

[target.'cfg(windows)'.dependencies]
# webview2-com and windows-core are pinned to the versions Tauri 2.11 already
# resolves, so the WebView2 interfaces this app hands to the webview are the very
# same types Tauri hands back.
webview2-com = "0.38.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security_Credentials",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
